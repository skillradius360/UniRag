[project]
name = "pdfreader"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "skillradius360", email = "abc@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastapi[standard]>=0.163.1",
    "groq>=1.7.0",
    "langchain>=1.5.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.8.3",
    "langchain-google-genai>=4.5.0",
    "langchain-groq>=1.2.0",
    "langchain-qdrant>=1.1.0",
    "langchain-text-splitters>=1.1.3",
    "pypdf>=7.1.1",
    "qdrant-client>=1.20.0",
]

[project.scripts]
pdfreader = "pdfreader:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
